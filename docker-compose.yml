services:

  postgres:
    image: "postgres:16-alpine"
    environment:
      POSTGRES_PASSWORD: 123321
      POSTGRES_USER: root
      POSTGRES_DB: go_app
    volumes:
      - ./internal/schemas/users.sql:/docker-entrypoint-initdb.d/users.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d go_app"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - go_app_network

  go_app:
    build: .
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - go_app_network

networks:
  go_app_network:
